name: Crypto Av Radari

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: crypto-av-radari
  cancel-in-progress: true

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kutuphaneleri kur
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Onceki radar durumunu geri yukle
        uses: actions/cache/restore@v4
        with:
          path: .radar_state
          key: radar-state-${{ github.run_id }}
          restore-keys: |
            radar-state-

      - name: Crypto Av Radarini calistir
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RADAR_STATE_FILE: .radar_state/state.json
        run: python radar.py

      - name: Radar durumunu kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .radar_state
          key: radar-state-${{ github.run_id }}
